name: Build APK

on:
  push:
    branches: [ main, master ] # Bonne pratique : déclencher uniquement sur les branches principales
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Accélère le build en mettant en cache les dépendances

      - name: Configuration de Java
        uses: actions/setup-java@v5 # Mis à jour vers v5 (v4 est déprécié)
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installation des dépendances
        run: npm install

      - name: Préparation de la plateforme Android
        run: |
          if [ -d "android" ]; then
            echo "✅ Le dossier android existe déjà, synchronisation..."
            npx cap sync android
          else
            echo "⚠️ Le dossier android n'existe pas, ajout de la plateforme..."
            npx cap add android
            npx cap sync android
          fi

      - name: Génération des icônes (optionnel)
        run: |
          mkdir -p assets
          mv icon-*.png assets/ 2>/dev/null || true
          if [ -f assets/icon-only.png ]; then
            echo "🎨 Génération des ressources d'icônes..."
            npx --yes @capacitor/assets generate --android --iconBackgroundColor "#07060d" --iconBackgroundColorDark "#07060d"
            npx cap sync android # Resync pour intégrer les nouvelles icônes
          fi

      - name: Construction de l'APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload de l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7 # Supprime l'artefact après 7 jours pour économiser l'espace de stockage
